name: Compilar VireEdison
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release --target VireEdison_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: VireEdison-VST3
          path: build/VireEdison_artefacts/Release/VST3/VireEdison.vst3
